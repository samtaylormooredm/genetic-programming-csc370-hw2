# To run with terminal: python -u gp.py configs/dataset2.yaml
# To run with slurm: sbatch submit.sh configs/dataset2.yaml


dataset: dataset2.csv
integer_constants: false
error_metric: scaled
normalize_fitness: false

# GP seeds: each runs an independent experiment
# seeds: [370, 371, 372]
seeds: [371]

# Fixed data split shared by all runs
train_fraction: 0.7
split_seed: 42

# Population and tree limits
population_size: 500
generations: 1000
init_max_depth: 5
depth_limit: 17 # (Luke & Panait 2006, Sec. 3, p. 6)

# Selection and genetic operations
tournament_size: 3
crossover_rate: 0.8
mutation_rate: 0.1
immigrant_fraction: 0.1
# Among offspring-generation events:
# 80% crossover, 10% mutation, 10% reproduction.
# Fresh random trees fill 10% of the total population.

# Linear size penalty; not yet tuned for dataset 2
complexity_weight: 0.00001 # (Penalty method: Luke & Panait 2006, Sec. 5, p. 10)

# One CSV containing all seeds
log_file: "results/trial{dataset}_scaled_wide_constants_tourn3_mut10_imm10_pop{population_size}_gen{generations}_penalty{complexity_weight}.csv"