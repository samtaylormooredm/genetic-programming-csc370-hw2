dataset: dataset2.csv
integer_constants: false

# GP seeds: each runs an independent experiment
seeds: [370, 371, 372, 373, 374, 375, 376, 377, 378, 379]

# Fixed data split shared by all runs
train_fraction: 0.7
split_seed: 42

# Population and tree limits
population_size: 500
generations: 200
init_max_depth: 5
depth_limit: 17 # (Luke & Panait 2006, Sec. 3, p. 6)

# Selection and genetic operations
tournament_size: 7 # (Luke & Panait 2006, Sec. 3, p. 6)
crossover_rate: 0.9 # (Koza tutorial)
mutation_rate: 0.01 # (Koza tutorial)
# Remaining 9% probability selects reproduction

# Random immigrants
immigrant_fraction: 0.05 # (Cobb & Grefenstette, ICGA 1993; 
# best rate for an unchanging problem)

# Relative-error fitness plus a linear size penalty
error_metric: scaled

# Linear size penalty; scaled for MSE after cleaning
complexity_weight: 0.00001 # (Penalty method: Luke & Panait 2006, Sec. 5, p. 10)

# Divide x1 and x2 by 1e6 so inputs match the constant range [-10, 10]
input_scale: [1000000, 1000000, 1]

# One CSV containing all seeds
log_file: "results/{dataset}_B2_pop{population_size}_gen{generations}_penalty{complexity_weight}.csv"